name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile (light lint)
        run: python -m compileall -q spotbot scripts
      - name: Honesty gate
        run: python scripts/bot_gate.py
      - name: Pytest
        run: python -m pytest tests/ -q
